<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#050505"/>
  <circle cx="32" cy="32" r="25" fill="#050505" stroke="#b7ff37" stroke-width="3" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#b7ff37" stroke-width="1.5" opacity=".85"/>
  <text x="32" y="40" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25" font-weight="500" letter-spacing="-2"
        fill="#ffffff" stroke="#ffffff" stroke-width=".5" filter="url(#glow)">GP</text>
</svg>
