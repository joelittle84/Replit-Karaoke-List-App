<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1290" role="img" aria-label="Guilty Pleasures Live Band Karaoke">
  <defs>
    <clipPath id="recordClip">
      <circle cx="865" cy="541" r="290" />
    </clipPath>
    <style>
      @keyframes gp-record-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .gp-vinyl-spin {
        transform-box: view-box;
        transform-origin: 865px 541px;
        animation: gp-record-spin 7s linear infinite;
      }
    </style>
  </defs>

  <!-- Static full logo: vinyl record art, "PLEASURES" text, and "LIVE BAND KARAOKE" text -->
  <image
    href="/guilty_pleasures_exact_logo_transparent_production_v4.webp?v=3"
    x="0"
    y="0"
    width="1720"
    height="1290"
    preserveAspectRatio="xMidYMid meet"
  />

  <!-- Only the vinyl record circle spins; the text overlay above stays static -->
  <g clip-path="url(#recordClip)">
    <image
      class="gp-vinyl-spin"
      href="/guilty_pleasures_exact_logo_transparent_production_v4.webp?v=3"
      x="0"
      y="0"
      width="1720"
      height="1290"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>
